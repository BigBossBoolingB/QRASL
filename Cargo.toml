[package]
name = "qrasl"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake2-rfc = "0.2"
ed25519-dalek = "1.0"
rs-merkle = "1.2.0"
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.44", features = ["full"] }
wasmi = "0.9.1"
sled = "0.34"
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
config = "0.13"
jsonrpsee = { version = "0.14", features = ["full"] }
