[package]
name = "qrasl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qrasl"
path = "src/main.rs"

[dependencies]
pqcrypto-dilithium = "0.5.0"
blake3 = "1.8.2"
pqcrypto-traits = "0.3.5"
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_bytes = "0.11.19"
serde_with = "3.16.1"
